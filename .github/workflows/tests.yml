name: Toolkit checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/prepare_demo.py --output work/demo
  qgis:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install distribution QGIS runtime
        run: sudo apt-get update && sudo apt-get install -y python3-qgis
      - name: Export and reopen synthetic QGIS project
        run: QT_QPA_PLATFORM=offscreen /usr/bin/python3 scripts/qgis_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: qgis-synthetic-export
          path: work/qgis-ci/export/
